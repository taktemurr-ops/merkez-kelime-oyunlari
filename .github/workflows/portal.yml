name: Web portal packages (CrazyGames / Poki / HTML5)

# Seçilmiş oyunlar için tek oyunluk, küçük HTML5 paketleri (tool/portal_games.json).
# Her oyun: <oyun>-crazygames.zip, <oyun>-poki.zip, <oyun>-html5.zip.
# Portal SDK'ları yalnızca ilgili paketin index.html'inde; Dart tarafı
# --dart-define=PORTAL=1 ile window.gs100Portal köprüsünü kullanır.
# Ayrıntılar: ship/MASAUSTU_WEB.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: false
  # (uzun masaüstü/portal derlemeleri sık push ile iptal olmasın; bekleyen en yeni çalışma kalır)

env:
  FLUTTER_VERSION: "3.47.9"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HUB: merkez-kelime-oyunlari

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sounds (generated)
        run: |
          pip install pillow==11.0.0 pyyaml==6.0.2
          python tool/generate_assets.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build portal bundles
        run: python tool/portal_build.py
      - name: One zip for the test release
        run: |
          cd dist/portal && zip -q -0 "../$HUB-portal.zip" *.zip SIZES.md && cd - && ls -l dist dist/portal
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HUB }}-portal
          path: dist/portal/
          if-no-files-found: error
          retention-days: 14
      - name: Upload to the "test" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view test >/dev/null 2>&1 || gh release create test --prerelease --target "$GITHUB_SHA" --title "Test sürümü" --notes "Her başarılı derlemede güncellenir." || true
          gh release upload test "dist/$HUB-portal.zip" --clobber
    permissions:
      contents: write
